name: Preparation checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[checks,serve]' -r infra/session/requirements.txt
      - run: python -m unittest discover -s tests -v
      # Pulumi mock runtime owns its event loop; keep it in a separate process.
      - run: python checks/infra_contract.py -v
      - run: python checks/manifests.py
      - run: python checks/runtime_contract.py
      - run: python checks/adapter_contract.py -v
      - run: python checks/ray_smoke.py
  expiry-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: docker build -f containers/expiry.Dockerfile -t inference-lab-expiry:check .
