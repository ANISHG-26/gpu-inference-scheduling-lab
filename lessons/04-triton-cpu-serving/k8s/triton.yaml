apiVersion: v1
kind: Service
metadata:
  name: triton
spec:
  type: ClusterIP
  selector:
    app: triton
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: triton
spec:
  serviceName: triton
  replicas: 1
  selector:
    matchLabels:
      app: triton
  template:
    metadata:
      labels:
        app: triton
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver@sha256:1f08352ff9318894ca24bb36a532ad450b1289f7a6aeb163ae752a446c400fe6
          command: ["/opt/tritonserver/bin/tritonserver"]
          args:
            - --model-repository=/models
            - --model-control-mode=none
            - --allow-gpu-metrics=false
            - --allow-grpc=false
            - --pinned-memory-pool-byte-size=0
          env:
            - {name: HOME, value: /tmp}
            - {name: TMPDIR, value: /tmp}
            - {name: XDG_CACHE_HOME, value: /tmp/.cache}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
          ports:
            - {name: http, containerPort: 8000, protocol: TCP}
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
              ephemeral-storage: 128Mi
            limits:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet: {path: /v2/health/ready, port: http}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /v2/health/ready, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: model, mountPath: /models/lab_double/config.pbtxt, subPath: lab_double/config.pbtxt, readOnly: true}
            - {name: model, mountPath: /models/lab_double/1/model.py, subPath: lab_double/1/model.py, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: model
          configMap:
            name: triton-model
            defaultMode: 0444
            items:
              - {key: config.pbtxt, path: lab_double/config.pbtxt}
              - {key: model.py, path: lab_double/1/model.py}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: triton
spec:
  podSelector:
    matchLabels:
      app: triton
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: lab-operator
      ports:
        - {protocol: TCP, port: 8000}
  egress: []
