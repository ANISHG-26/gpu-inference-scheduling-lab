apiVersion: v1
kind: Service
metadata:
  name: vllm
spec:
  type: ClusterIP
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vllm
spec:
  serviceName: vllm
  replicas: 1
  selector:
    matchLabels: {app: vllm}
  template:
    metadata:
      labels: {app: vllm}
    spec:
      serviceAccountName: inference-lab
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app: vllm}
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: model
          image: vllm/vllm-openai-cpu:v0.27.1-x86_64@sha256:0314b8a7594a3fc54e8a0c3ca1ba0c9257302bfb546abfb49a2d6107d2d0767f
          args:
            - Qwen/Qwen3-0.6B
            - --revision=c1899de289a04d12100db370d81485cdf75e47ca
            - --tokenizer-revision=c1899de289a04d12100db370d81485cdf75e47ca
            - --dtype=float32
            - --max-model-len=1024
            - --max-num-seqs=8
            - --kv-cache-memory-bytes=1073741824
            - --no-enable-log-requests
          env:
            - {name: HF_HOME, value: /cache/huggingface}
            - {name: HOME, value: /cache}
            - {name: OMP_NUM_THREADS, value: "2"}
            - {name: VLLM_CPU_OMP_THREADS_BIND, value: nobind}
          ports: [{name: http, containerPort: 8000}]
          resources:
            requests: {cpu: "2", memory: 8Gi}
            limits: {cpu: "2", memory: 8Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - {name: cache, mountPath: /cache}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: cache
          emptyDir: {sizeLimit: 6Gi}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 1Gi}
