apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab-operator
spec:
  podSelector:
    matchLabels: {app: lab-operator}
  policyTypes: [Ingress, Egress]
  # kubectl port-forward is the access path; no workload-to-console ingress.
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
        - ipBlock: {cidr: 169.254.20.10/32} # GKE NodeLocal DNS if enabled
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchExpressions:
              - {key: ray.io/node-type, operator: In, values: [head, worker]}
      ports: [{protocol: TCP, port: 8000}]
    # Fail closed. The activation overlay must replace this documentation-only
    # address with the exact Kubernetes API endpoint /32 (and verify datapath
    # service translation). Never enable a broad Internet egress workaround.
    - to:
        - ipBlock: {cidr: 192.0.2.1/32}
      ports: [{protocol: TCP, port: 443}]
