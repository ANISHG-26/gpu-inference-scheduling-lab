apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-operator
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-operator-observer
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-operator-observer
subjects:
  - kind: ServiceAccount
    name: lab-operator
    namespace: inference-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab-operator-observer
---
apiVersion: v1
kind: Service
metadata:
  name: lab-operator
spec:
  type: ClusterIP
  selector: {app: lab-operator}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-operator
spec:
  replicas: 1
  # Preserve one process/admission lock while replacing the disposable console.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: lab-operator}
  template:
    metadata:
      labels: {app: lab-operator}
    spec:
      serviceAccountName: lab-operator
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: operator
          image: registry.invalid/inference-lab/operator:review-required
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: ACTIVE_LESSON, value: ""}
            - {name: EXPECTED_RAY_CLUSTER, value: ""}
            - {name: LAB_ACTIONS_ENABLED, value: "false"}
            # Replace from the immutable lifecycle record, never a new UI timer.
            - {name: LAB_EXPIRES_AT, value: "0"}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          volumeMounts:
            - name: kube-api
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: kube-api
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3600}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
